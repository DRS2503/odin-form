<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css"> 
    <script src="scripts.js" defer></script>
</head>
<body>


    <div id="img-div">
        <img src="img/halie-west-25xggax4bSA-unsplash.jpg">
        <div class="odin">
            <img src="img/odin-lined.png" class="odin-pic">
            <h1 class="odin-text">ODIN</h1>
        </div>
        <p class="credit">Photo by Halie West on Unsplash</p>
    </div>



    <div id="content-div">
        <div id="hero-div" class="content">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
            <p>You know you want to.</p>
        </div>

        <div id="form-div" class="content">
            <h2>Let's do this!</h2>
            <form id="form" action="data.txt" method="post">
                <div class="row-div">
                    <div class="input">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>                
                    <div class="input">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" required> 
                    </div>    
                </div>
                <div class="row-div">
                    <div class="input">
                        <label for="Email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>    
                    <div class="input">
                        <label for="phone-number">Phone Number</label>
                        <input type="number" id="phone-number" name="phone-number" required>     
                    </div>    
                </div>
                <div class="row-div">
                    <div class="input">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>                   
                    <div class="input">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required> 
                    </div>    
                </div>               
            </form>
        </div>

        <div id="btn-div" class="content">
            <button type="submit" form="form">Create Account</button>
            <p>Already have an account? <a>Log in</a></p>
        </div>

    </div>  
</body>
</html>
